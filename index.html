   Bo'sh qolsa — namuna ma'lumot ishlatiladi (faqat ko'rish uchun). */
const API_BASE = "";

async function api(path, opts={}){
  const headers = { "X-Init-Data": window.Telegram?.WebApp?.initData || "", ...(opts.headers||{}) };
  let body = opts.body;
  if(opts.json){ headers["Content-Type"]="application/json"; body=JSON.stringify(opts.json); }
  const res = await fetch(API_BASE + path, { method: opts.method||"GET", headers, body });
  if(!res.ok) throw new Error(await res.text().catch(()=>res.status));
  return res.json();
}

/* Emoji o'rniga harakatlanadigan media. src bo'lsa — GIF/MP4/Lottie ko'rsatadi,
   bo'lmasa — oddiy emoji. Fayl turini o'zi aniqlaydi. */
function Media({src, type, emoji, size=44}){
  if(!src) return <span style={{fontSize:size*0.8, lineHeight:1}}>{emoji}</span>;
  const ext = (type || (src.split('?')[0].split('.').pop()||"")).toLowerCase();
  const style = {width:size, height:size, objectFit:'contain'};
  if(ext==="json" || type==="lottie")
    return <lottie-player src={src} autoplay loop style={{width:size,height:size}}></lottie-player>;
  if(["mp4","webm","mov"].includes(ext))
    return <video src={src} autoPlay loop muted playsInline style={style}></video>;
  return <img src={src} style={style} alt="" />;  // gif, png, jpg, webp
}

    try{ const fd=new FormData(); fd.append("slot",slot); fd.append("file",f);

      CARD_MEDIA[slot]={src:r.src,type:r.type}; setMsg("✅ Yuklandi"); }
    catch(err){ setMsg("❌ "+err.message); }
  }
  return (
    <label className="tap block bg-card rounded-xl2 p-4 cursor-pointer">

      <input type="file" accept=".gif,.png,.jpg,.jpeg,.webp,.mp4,.webm,.json" onChange={up} className="hidden"/>

  );
}

        </div>
        <label className="flex items-center gap-2 text-[15px]">
          <input type="checkbox" checked={form.rare} onChange={e=>setForm({...form,rare:e.target.checked})}/> Noodatiy
        </label>
        <label className="tap block bg-card2 rounded-xl2 p-3 cursor-pointer text-[14px]">
          {form.file ? "📎 "+form.file.name : "Rasm/animatsiya (GIF/MP4/Lottie) — ixtiyoriy"}
          <input type="file" accept=".gif,.png,.jpg,.jpeg,.webp,.mp4,.webm,.json" onChange={e=>setForm({...form,file:e.target.files[0]})} className="hidden"/>
        </label>
        <button onClick={add} className="tap w-full bg-tgblue text-white font-bold py-3 rounded-xl2">Qo'shish</button>
        {msg && <div className="text-center text-[14px]">{msg}</div>}
      </div>
      <div className="grid grid-cols-3 gap-2">
        {list.filter(g=>g.active).map(g=>(
          <div key={g.id} className="relative bg-card2/60 rounded-xl2 p-3 flex flex-col items-center">
            <button onClick={()=>del(g.id)} className="tap absolute top-1 right-1 w-6 h-6 rounded-full bg-red-500/80 text-white text-xs">✕</button>
            <div className="my-2"><Media emoji={g.emoji} src={g.media?.src} type={g.media?.type} size={40}/></div>
            <div className="text-[12px] font-semibold text-center leading-tight">{g.name}</div>
            <div className="text-tg text-[12px]">{fmt(g.price)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AdminPremium(){
  const [list,setList]=useState([]);
  const [msg,setMsg]=useState("");
  async function load(){ try{ setList(await api("/api/admin/premium")); }catch(e){} }
  useEffect(()=>{ load(); },[]);
  async function save(p){ try{ await api("/api/admin/premium",{method:"POST",json:p}); setMsg("✅ Saqlandi"); load(); }catch(e){ setMsg("❌ "+e.message); } }
  return (
    <div className="space-y-3">
      <div className="text-sub text-[14px]">Har bir muddat narxi va chegirma foizini o'zgartiring.</div>
      {list.map((p,i)=>(
        <div key={p.id} className="bg-card rounded-xl3 p-4 space-y-2">
          <div className="font-bold">{p.months===12?"1 yil":p.months+" oy"}</div>
          <div className="flex gap-2">
            <input type="number" defaultValue={p.price} onChange={e=>list[i].price=Number(e.target.value)} placeholder="Narx" className="flex-1 bg-card2 rounded-xl2 px-3 h-11 outline-none"/>
            <input type="number" defaultValue={p.discount} onChange={e=>list[i].discount=Number(e.target.value)} placeholder="%" className="w-20 bg-card2 rounded-xl2 px-3 h-11 outline-none"/>
          </div>
          <button onClick={()=>save(list[i])} className="tap w-full bg-tgblue/90 text-white font-semibold py-2.5 rounded-xl2 text-[14px]">Saqlash</button>
        </div>
      ))}
      {msg && <div className="text-center text-[14px]">{msg}</div>}
    </div>
  );
}

function AdminAdmins(){
  const [list,setList]=useState([]);
  const [id,setId]=useState("");
  const [msg,setMsg]=useState("");
  async function load(){ try{ setList(await api("/api/admin/admins")); }catch(e){} }
  useEffect(()=>{ load(); },[]);
  async function add(){ if(!id) return; try{ await api("/api/admin/admins",{method:"POST",json:{admin_id:Number(id)}}); setId(""); setMsg("✅"); load(); }catch(e){ setMsg("❌ "+e.message); } }
  async function del(aid){ try{ await api("/api/admin/admins/"+aid,{method:"DELETE"}); load(); }catch(e){ setMsg("❌ "+e.message); } }
  return (
    <div className="space-y-3">
      <div className="text-sub text-[14px]">Yangi admin Telegram ID sini qo'shing.</div>
      <div className="flex gap-2">
        <input type="number" value={id} onChange={e=>setId(e.target.value)} placeholder="Telegram ID" className="flex-1 bg-card rounded-xl2 px-4 h-12 outline-none"/>
        <button onClick={add} className="tap bg-tgblue text-white font-bold px-6 rounded-xl2">Qo'shish</button>
      </div>
      {list.map(a=>(
        <div key={a.id} className="bg-card rounded-xl2 px-4 h-14 flex items-center justify-between">
          <span className="font-mono">{a.id} {a.super && <span className="text-tg text-[12px]">(asosiy)</span>}</span>
          {!a.super && <button onClick={()=>del(a.id)} className="tap text-red-400 text-[14px]">O'chirish</button>}
        </div>
      ))}
      {msg && <div className="text-center text-[14px]">{msg}</div>}
    </div>
  );
}

/* ---- umumiy "Sotib olish" tugmasi ---- */
function BuyButton({label,onClick,disabled}){
  return (
    <button disabled={disabled} onClick={onClick}
      className={`tap fixed left-4 right-4 bottom-[calc(env(safe-area-inset-bottom)+16px)] py-4 rounded-xl3 font-bold text-[17px] ${disabled?'bg-card2 text-sub':'bg-tgblue text-white shadow-[0_0_24px_rgba(0,122,255,.4)]'}`}>
      {label}
    </button>
  );
}

/* ====================== TIL KONTEKSTI (sodda global) ====================== */
let CUR_LANG = "uz";
const STR_CTX = () => STR[CUR_LANG] || STR.uz;

/* ====================== ASOSIY ILOVA ====================== */
function App(){
  const [user] = useState(getUser);
  const [tab,setTab]=useState("main");      // main/referral/history/rating/profile
  const [screen,setScreen]=useState(null);  // stars/premium/gifts/balans/admin
  const [langOpen,setLangOpen]=useState(false);
  const [, force]=useState(0);

  useEffect(()=>{
    if(tg){ tg.ready(); tg.expand(); try{tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');}catch(e){} }
    const saved = tg?.initDataUnsafe?.user?.language_code;
    if(saved && STR[saved]) CUR_LANG = saved;

    if(!API_BASE) return;  // backend ulanmagan — namuna bilan ishlaydi
    (async()=>{
      try{
        const cfg = await api("/api/config");
        PER_STAR = cfg.per_star || PER_STAR;
        STAR_PACKS = buildPacks();
        if(cfg.premium?.length) PREMIUM_PLANS = cfg.premium.map(p=>({
          id:p.id, months:p.months, label:premLabel(p.months), price:p.price, disc:p.discount, admin:p.admin_only
        }));
        CARD_MEDIA = { stars:{}, premium:{}, gifts:{}, ref:{}, ...(cfg.media||{}) };
        IS_ADMIN = !!cfg.is_admin;
        if(cfg.lang && STR[cfg.lang]) CUR_LANG = cfg.lang;
        const gifts = await api("/api/gifts");
        if(gifts?.length) GIFTS = gifts.map(g=>({ id:g.id, n:g.name, e:g.emoji||"🎁", p:g.price, r:g.rare, media:g.media }));
      }catch(e){ console.warn("API yuklanmadi:", e.message); }
      force(x=>x+1);
    })();
  },[]);

  const go = s => { setScreen(s); window.scrollTo(0,0); };
  function pickLang(code){ CUR_LANG=code; setLangOpen(false); force(x=>x+1); if(API_BASE) api("/api/lang",{method:"POST",json:{lang:code}}).catch(()=>{}); }

  // To'liq ekranlar (navigatsiyadan ustun)
  if(screen==="stars")   return <StarsScreen user={user} go={go}/>;
  if(screen==="premium") return <PremiumScreen user={user} go={go}/>;
  if(screen==="gifts")   return <GiftsScreen go={go}/>;
  if(screen==="balans")  return <BalansScreen go={go}/>;
  if(screen==="admin")   return <AdminScreen go={go}/>;

  return (
    <div>
      {tab!=="main" && <div className="px-4 pt-3"></div>}
      {tab==="main"     && <MainScreen user={user} go={go} setTab={setTab}/>}
      {tab==="referral" && <ReferralScreen user={user}/>}
      {tab==="history"  && <HistoryScreen/>}
      {tab==="rating"   && <RatingScreen/>}
      {tab==="profile"  && <ProfileScreen user={user} go={go} setLangScreen={setLangOpen} openAdmin={()=>go("admin")}/>}
      <BottomNav tab={tab} setTab={setTab} user={user}/>
      {langOpen && <LangSheet onClose={()=>setLangOpen(false)} onPick={pickLang}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
